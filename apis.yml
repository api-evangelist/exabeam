aid: exabeam
name: Exabeam
description: >-
  Exabeam is a cybersecurity company that delivers faster, more accurate threat
  detection, investigation, and response (TDIR) through its AI-driven security
  operations platform. The platform combines cloud-native SIEM (security
  information and event management), user and entity behavioral analytics
  (UEBA), log management and collection, correlation and detection rules, and
  automated investigation workflows so security operations center (SOC) teams
  can monitor, triage, and respond to threats at scale. Exabeam exposes a REST
  API surface through its developer hub (developers.exabeam.com, hosted on
  ReadMe) covering access control, audit, authentication, cloud and site log
  collectors, context management, correlation rules, detection management, MITRE
  ATT&CK mappings, search, service health and consumption, threat center, and
  use cases. APIs are served from eight regional gateway hosts on the
  exabeam.cloud domain and secured with OAuth2 (API key and secret issued in the
  console). Exabeam also publishes an MCP server for agent-based access.
